<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser CLI Capture Tool</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📸 Browser CLI Capture Tool</h1>
  </div>
  <div class="mode-toggle">
    <button type="button" class="mode-btn active" data-mode="single" onclick="setMode('single')">Single</button>
    <button type="button" class="mode-btn" data-mode="multi" onclick="setMode('multi')">Multi</button>
    <button type="button" class="mode-btn" data-mode="mhtml" onclick="setMode('mhtml')">MHTML</button>
    <button type="button" class="mode-btn" data-mode="html" onclick="setMode('html')">HTML</button>
  </div>
  <div class="form-container">
    <form id="screenshot-form">
      <div class="form-group">
        <label for="url">URL</label>
        <input type="text" id="url" name="url" placeholder="example.com" autofocus required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="width">Width (px)</label>
          <input type="number" id="width" name="width" placeholder="1280">
        </div>
        <div class="form-group">
          <label for="height">Height (px)</label>
          <input type="number" id="height" name="height" placeholder="720">
        </div>
        <div class="form-group">
          <label for="waitTime">Wait (ms)</label>
          <input type="number" id="waitTime" name="waitTime" placeholder="1000" min="0" step="100">
        </div>
      </div>

      <div id="screenshot-options">
      <div class="advanced-toggle" onclick="toggleAdvanced()">⚙️ Advanced Options</div>
      <div id="advanced-options" class="advanced-options">
        <div class="form-row">
          <div class="form-group">
            <label for="output_width">Output Width (px)</label>
            <input type="number" id="output_width" name="output_width" placeholder="Original" min="1">
          </div>
          <div class="form-group">
            <label for="output_format">Output Format</label>
            <select id="output_format" name="output_format">
              <option value="">PNG</option>
              <option value="webp">WebP</option>
              <option value="jpeg">JPEG</option>
            </select>
          </div>
          <div class="form-group">
            <label for="output_quality">Output Quality (1-100)</label>
            <input type="number" id="output_quality" name="output_quality" placeholder="80" min="1" max="100">
          </div>
        </div>
      </div>
      </div>

      <div id="multi-section" class="multi-section hidden">
        <h3>Output Configurations</h3>
        <div id="outputs-list"></div>
        <button type="button" class="btn btn-secondary" onclick="addOutput()">+ Add Output</button>
      </div>

      <div id="page-file-options" class="page-file-options hidden">
        <label><input type="checkbox" name="asIs"> Skip page preparation (capture as-is)</label>
      </div>

      <button type="submit" class="btn" id="submit-btn">📸 Capture Screenshot</button>
    </form>
  </div>

  <div id="result-container" class="result-container result-single">
    <div class="result-actions">
      <button class="btn btn-secondary" onclick="downloadScreenshot()">⬇️ Download</button>
      <button class="btn btn-secondary" onclick="resetForm()">🔄 New Screenshot</button>
    </div>
    <div class="screenshot-preview"><img id="screenshot-img" alt="Screenshot"></div>
  </div>

  <div id="result-container-multi" class="result-container result-multi">
    <div class="result-actions">
      <button class="btn btn-secondary" onclick="resetForm()">🔄 New Capture</button>
    </div>
    <div id="multi-results" class="multi-results"></div>
  </div>

  <div id="result-container-mhtml" class="result-container result-mhtml">
    <div class="result-actions">
      <button class="btn btn-secondary" onclick="downloadPageFile()">⬇️ Download MHTML</button>
      <button class="btn btn-secondary" onclick="resetForm()">🔄 New Capture</button>
    </div>
    <p>Your MHTML archive is ready to download.</p>
  </div>

  <div id="result-container-html" class="result-container result-html">
    <div class="result-actions">
      <button class="btn btn-secondary" onclick="downloadPageFile()">⬇️ Download HTML</button>
      <button class="btn btn-secondary" onclick="resetForm()">🔄 New Capture</button>
    </div>
    <p id="html-final-url" class="final-url"></p>
    <pre id="html-source" class="screenshot-preview html-source"></pre>
  </div>
</div>
<script src="/js/app.js"></script>
</body>
</html>
